            width: 100vw;
            height: 100vh;
        }

        /* Estilo de enfoque para control remoto o teclado en PC */
        .tv-focusable {
            transition: all 0.15s cubic-bezier(0.4, 0, 0.2, 1);
        }
        .tv-focusable:focus, .tv-focusable.focused, .tv-focusable:hover {
            outline: none;
            transform: scale(1.01);
            border: 2px solid #E50914 !important;
            box-shadow: 0 0 20px rgba(229, 9, 20, 0.8);
            z-index: 50;
            background-color: #1f2937 !important;
        }

        ::-webkit-scrollbar-track { background: #0c101d; }
        ::-webkit-scrollbar-thumb { background: #374151; border-radius: 3px; }

            { "titulo": "Abbott y Costello en la legión", "descripcion": "Aventuras y enredos en la Legión Extranjera.", "imagen": "https://m.media-amazon.com/images/M/MV5BMzA1MDgwNjk4M15BMl5BanBnXkFtZTYwNzA5OTI5._V1_QL75_UX159_.jpg", "urlDrive": "https://drive.google.com/file/d/1-QMjFclS6I3cNjY4FeqTazsvlkGCUlrM/view?usp=sharing", "codigo": null },

            { "titulo": "Abbott y Costello vs Dr. Jekyll", "descripcion": "Policías en Londres que se topan con la pócima del Dr. Jekyll.", "imagen": "https://i5.walmartimages.com/seo/Abbott-and-Costello-Meet-Dr-Jekyll-and-Mr-Hyde-DVD-Shock-Comedy_92bc5dae-ee24-4672-b59f-79fd4df902b3.2dd52632dd11e870685969957451a651.jpeg", "urlDrive": "https://drive.google.com/file/d/1L8Ol-mgSkpNCflBn7T4BuuzLk3hxtVW5/view?usp=sharing", "codigo": null },
            { "titulo": "Abbott y Costello En Venus", "descripcion": "Lanzamiento accidental de cohete hacia un planeta de mujeres.", "imagen": "https://www.mauvais-genres.com/36933-thickbox_default/abbott-and-costello-go-to-mars-movie-poster-14x21-in-1953-charles-lamont-bud-abbot-lou-costello.jpg", "urlDrive": "https://drive.google.com/file/d/1jKxY0n5eOWtpAUChtuRywPmAitf7zo97/view?usp=sharing", "codigo": null },
            { "titulo": "Depredador 1 (1987)", "descripcion": "Fuerzas especiales cazadas por un extraterrestre en la jungla.", "imagen": "https://www.cinecalidad.rs/wp-content/uploads/2017/07/depredador.jpg", "urlDrive": "https://drive.google.com/file/d/1qca85Ro5ho71aio185w7Qc3mQftzkOVo/view?usp=sharing", "codigo": null },
            { "titulo": "Mister Ed", "descripcion": "Un caballo que habla e interrumpe la vida de su dueño.", "imagen": "https://www.lavanguardia.com/peliculas-series/images/serie/poster/1961/1/w1280/po4hZHoInhRvpOkwZ1nVcdyCrtC.jpg", "urlDrive": "https://drive.google.com/file/d/1CM0uqnzV2SpOLX8KajVAajDWr7icznkB/view?usp=sharing", "codigo": null },
            { "titulo": "El hombre del rifle (1958)", "descripcion": "Lucas McCain ayuda al sheriff con su gran habilidad con el Winchester.", "imagen": "https://pics.filmaffinity.com/El_hombre_del_rifle_Serie_de_TV-611880410-large.jpg", "urlDrive": "https://drive.google.com/file/d/11qPTfzKeFCBlZGnBIIj1i3gk1yPbM2rZ/view?usp=sharing", "codigo": null },
            { "titulo": "Tarzan and His Mate", "descripcion": "Safari africano en busca de marfil.", "imagen": "https://resizing.flixster.com/yzZ85j4cDU8B1g7cPNcnXy0w0Bg=/206x305/v2/https://resizing.flixster.com/-XZAfHZM39UwaGJIFWKAE8fS0ak=/v3/t/assets/p3275_p_v8_an.jpg", "urlDrive": "https://drive.google.com/file/d/1YAYUo7G9PD4mnjpHVJ3UXr1YX3fQoEnd/view?usp=sharing", "codigo": null },
            { "titulo": "Sargento Preston 1955", "descripcion": "Policía Montada de Canadá en el Yukón.", "imagen": "https://m.media-amazon.com/images/I/819OiDUVL2L._UF1000,1000_QL80_.jpg", "urlDrive": "https://drive.google.com/file/d/1o_HW7yQqDS_MdFQSpsWRMcN9uruqsXqO/view?usp=sharing", "codigo": null },
            { "titulo": "Flipper", "descripcion": "Aventuras del simpático delfín.", "imagen": "https://m.media-amazon.com/images/M/MV5BMTc3NTM4NTMwOF5BMl5BanBnXkFtZTcwMjM1Mjg4NA@@._V1_FMjpg_UX1000_.jpg", "urlDrive": "https://drive.google.com/file/d/1hkCMhgkOhBRLbD08_FTM9KJ4PmAPjpiQ/view?usp=sharing", "codigo": null },
            { "titulo": "Tarzán y las amazonas", "descripcion": "Búsqueda de una antigua ciudad en un valle oculto.", "imagen": "https://cartelesmix.es/cartelesdecine/wp-content/uploads/2018/07/tarzanylasamazonas45008.jpg", "urlDrive": "https://drive.google.com/file/d/17lnv7F-DBvOYsmhKhUr_fT3Z3WwF5xOT/view?usp=sharing", "codigo": null },
            { "titulo": "Mi Marciano Favorito", "descripcion": "Un extraterrestre varado en la Tierra.", "imagen": "https://m.media-amazon.com/images/M/MV5BNDg2NTMwMzA0M15BMl5BanBnXkFtZTcwMTQ2NDUxMQ@@._V1_FMjpg_UX1000_.jpg", "urlDrive": "https://drive.google.com/file/d/1k9PNst5sndGrG92oykUyswM-fxqsWpGs/view?usp=sharing", "codigo": null },
            { "titulo": "LASSIE - SERIE TV", "descripcion": "Galardonada serie con el inolvidable perro collie.", "imagen": "https://www.lavanguardia.com/peliculas-series/images/serie/poster/1954/9/w300/vqbVr4fYRZb28ywczaidn29JJTA.jpg", "urlDrive": "https://drive.google.com/file/d/1JQEl5FtTpHiKvrdKredtki3qgUtQod0S/view?usp=sharing", "codigo": null },
            { "titulo": "Daktari", "descripcion": "Centro de estudios animales en África.", "imagen": "https://m.media-amazon.com/images/I/51nHajPxU9L._UF894,1000_QL80_.jpg", "urlDrive": "https://drive.google.com/file/d/1J7XXVoQmK5pj5XeF68T4FaA91hltZSGm/view?usp=sharing", "codigo": null },
            { "titulo": "Las Aventuras de Rin Tin Tin", "descripcion": "Clásica serie de TV ambientada en el Salvaje Oeste.", "imagen": "https://m.media-amazon.com/images/M/MV5BMzgyYTYwZGQtNDcwNC00ODhhLThlYjYtYzIxOGMxNDExZTNlXkEyXkFqcGc@._V1_.jpg", "urlDrive": "https://drive.google.com/file/d/1EbHgQhySwZfR0lyCjmQnMkJ-P70RL74d/view?usp=sharing", "codigo": null },
            { "titulo": "Misión Imposible ( 1966 )", "descripcion": "Un clásico de la televisión con la Fuerza de Misiones Imposibles.", "imagen": "https://s3.opensubtitles.com/features/4/0/2/8204.jpg", "urlDrive": "https://drive.google.com/file/d/15h74amMWOgxKqoCdsXl80ibEF7z2cw99/view?usp=sharing", "codigo": null },
            { "titulo": "LOS 3 CHIFLADOS", "descripcion": "Comedia basada en el slapstick y la comicidad física.", "imagen": "https://www.lavanguardia.com/peliculas-series/images/serie/poster/2024/5/w1280/o5aZTW2nFVCQzkiOnaiAXgRzKcc.jpg", "urlDrive": "https://drive.google.com/file/d/1sn5gdexgBmAwbtndQ3sT29_6FPs2JHE0/view?usp=sharing", "codigo": null },
            { "titulo": "Titanes en el ring", "descripcion": "Aventuras con Martín Karadagián y su troupe.", "imagen": "https://www.radiocantilo.com/adjuntos/cantilo/2018/10/titanes-en-el-ring-Silva-brothers-720x1024.jpg", "urlDrive": "https://drive.google.com/file/d/1p2Lp7q2Vj6Yhxs2qBOE8GsqTYYA1dkP-/view?usp=sharing", "codigo": null },
            { "titulo": "La Pandilla (1955)", "descripcion": "Niños con habilidades especiales para ayudar a los demás.", "imagen": "https://pics.filmaffinity.com/La_Pandilla_Serie_de_TV-229666271-large.jpg", "urlDrive": "https://drive.google.com/file/d/1X_QOyjR9h5zQcBGiRuUJ7GAO5ErfyfYw/view?usp=sharing", "codigo": null },
            { "titulo": "Viaje Al Centro De La Tierra", "descripcion": "Exploración a través de un volcán islandés.", "imagen": "https://m.media-amazon.com/images/M/MV5BMTg2MjkyMjMzM15BMl5BanBnXkFtZTYwMjQ1ODg4._V1_.jpg", "urlDrive": "https://drive.google.com/file/d/130YMhi-XFGnAy8cJ76U2Wnk4CRy3KSVM/view?usp=sharing", "codigo": null },
            { "titulo": "GREASE (1978)", "descripcion": "Musical romántico protagonizado por John Travolta y Olivia Newton John.", "imagen": "https://i.pinimg.com/736x/76/65/a0/7665a0f3298262e079b2d8fd3fa734a2.jpg", "urlDrive": "https://drive.google.com/file/d/1AfkegbTGrVEKXUN8Ninr54Kk0Mb037k2/view?usp=sharing", "codigo": null }
        ];

        const cleanDriveUrl = (url) => { 
            if (!url) return ''; 
            if (url.includes('drive.google.com')) { 
                const match = url.match(/\/file\/d\/([a-zA-Z0-9_-]+)/) || url.match(/id=([a-zA-Z0-9_-]+)/);
                if (match) {
                    return `https://drive.google.com/file/d/${match[1]}/preview?usp=sharing&rm=minimal&autoplay=1`;
                }
            } 
            return url; 
        };

        const App = () => {
            const [activeCategory, setActiveCategory] = useState('peliculas'); 
            const [items, setItems] = useState([]);
            const [menuIndex, setMenuIndex] = useState(0); 
            const [cardIndex, setCardIndex] = useState(0); 
            const [isMenuSelected, setIsMenuSelected] = useState(true); 
            
            const [selectedSerie, setSelectedSerie] = useState(null);
            const [activeSeasonIndex, setActiveSeasonIndex] = useState(0);
            const [episodeIndex, setEpisodeIndex] = useState(0);

            const [playingItem, setPlayingItem] = useState(null);
            const [pinModalItem, setPinModalItem] = useState(null);
            const [pinInput, setPinInput] = useState('');
            const [pinError, setPinError] = useState(false);
            
            const menuRefs = useRef([]);
            const cardRefs = useRef([]);
            const episodeRefs = useRef([]);

            useEffect(() => {
                const loadAllContent = async () => {
                    let tvList = [];
                    let kidsList = [];
                    let seriesList = [];

                    try {
                        const tvRes = await fetch('https://raw.githubusercontent.com/sejo48/retrom3u/refs/heads/main/listaoficial.m3u');
                        const tvText = await tvRes.text();
                        tvList = parseM3U(tvText);
                    } catch (e) {}

                    try {
                        const seriesRes = await fetch('https://raw.githubusercontent.com/sejo48/jorgedrive/refs/heads/main/playlist.json');
                        const seriesJson = await seriesRes.json();
                        seriesList = (Array.isArray(seriesJson) ? seriesJson : []).map((s, i) => ({
                            id: `serie-${i}`,
                            titulo: s.tituloSerie || s.name,
                            descripcion: s.descripcion || s.sinopsis,
                            imagen: s.imagen || s.image,
                            codigo: s.codigo || s.pin,
                            type: 'serie',
                            seasons: (s.temporadas || []).map(t => ({
                                season_number: t.numeroTemporada || 1,
                                episodes: (t.episodios || []).map(e => ({
                                    titulo: e.tituloEpisodio || e.title,
                                    urlDrive: cleanDriveUrl(e.urlDrive || e.url)
                                }))
                            }))
                        }));
                    } catch (e) {}

                    try {
                        const kidsRes = await fetch('https://raw.githubusercontent.com/sejo48/animados./refs/heads/main/animados.json');
                        const kidsJson = await kidsRes.json();
                        kidsList = (Array.isArray(kidsJson) ? kidsJson : []).map((a, i) => ({
                            titulo: a.titulo || a.tituloSerie || a.name,
                            descripcion: a.descripcion || a.sinopsis,
                            imagen: a.imagen || a.image || a.poster,
                            urlDrive: cleanDriveUrl(a.urlDrive || a.url),
                            codigo: a.codigo || a.pin,
                            type: 'animado'
                        }));
                    } catch (e) {}

                    const formattedMovies = STATIC_MOVIES.map(m => ({
                        ...m,
                        urlDrive: cleanDriveUrl(m.urlDrive),
                        type: 'pelicula'
                    }));

                    window.APP_CONTENT = {
                        peliculas: formattedMovies,
                        series: seriesList,
                        animados: kidsList,
                        tv: tvList
                    };

                    setItems(formattedMovies);
                };
                loadAllContent();
            }, []);

            const parseM3U = (data) => {
                const lines = data.split('\n');
                const channels = [];
                for (let i = 0; i < lines.length; i++) {
                    const line = lines[i].trim();
                    if (line.startsWith('#EXTINF:')) {
                        let title = 'Canal';
                        const url = lines[i + 1] ? lines[i + 1].trim() : '';
                        if (url && url.startsWith('http')) {
                            const logoMatch = line.match(/tvg-logo="([^"]*)"/); 
                            const logo = logoMatch ? logoMatch[1] : '';
                            const groupMatch = line.match(/group-title="([^"]*)"/); 
                            const group = groupMatch ? groupMatch[1] : 'General';
                            const commaIndex = line.lastIndexOf(',');
                            if (commaIndex !== -1) title = line.substring(commaIndex + 1).trim();
                            channels.push({ titulo: title, imagen: logo, urlDrive: url, group, type: 'tv' });
                        }
                    }
                }
                return channels;
            };

            const changeCategory = (cat) => {
                setActiveCategory(cat);
                setCardIndex(0);
                setSelectedSerie(null);
                if (window.APP_CONTENT && window.APP_CONTENT[cat]) {
                    setItems(window.APP_CONTENT[cat]);
                }
            };

            useEffect(() => {
                if (!playingItem && !pinModalItem) {
                    if (selectedSerie) {
                        if (episodeRefs.current[episodeIndex]) {
                            episodeRefs.current[episodeIndex].focus();
                        }
                    } else if (isMenuSelected) {
                        if (menuRefs.current[menuIndex]) {
                            menuRefs.current[menuIndex].focus();
                        }
                    } else {
                        if (cardRefs.current[cardIndex]) {
                            cardRefs.current[cardIndex].focus();
                            cardRefs.current[cardIndex].scrollIntoView({ behavior: 'smooth', block: 'center' });
                        }
                    }
                }
            }, [isMenuSelected, menuIndex, cardIndex, selectedSerie, episodeIndex, items, playingItem, pinModalItem]);

            // Manejador global de teclado optimizado con soporte total para Escape
            useEffect(() => {
                const handleKeyDown = (e) => {
                    const key = e.key;
                    const keyCode = e.keyCode;

                    // Si está reproduciendo, cualquier tecla de salida (Escape, Backspace, etc.) cierra el reproductor inmediatamente
                    if (playingItem) {
                        if (key === 'Escape' || key === 'Backspace' || keyCode === 8 || keyCode === 27 || keyCode === 461) {
                            e.preventDefault();
                            setPlayingItem(null);
                        }
                        return;
                    }

                    if (pinModalItem) {
                        if (key === 'Escape' || key === 'Backspace' || keyCode === 8 || keyCode === 27) {
                            setPinModalItem(null);
                            setPinInput('');
                            setPinError(false);
                        }
                        return;
                    }

                    if (selectedSerie) {
                        if (key === 'ArrowRight' || keyCode === 39) {
                            const currentSeason = selectedSerie.seasons[activeSeasonIndex];
                            if (currentSeason && currentSeason.episodes) {
                                setEpisodeIndex(prev => Math.min(prev + 1, currentSeason.episodes.length - 1));
                            }
                        } else if (key === 'ArrowLeft' || keyCode === 37) {
                            setEpisodeIndex(prev => Math.max(prev - 1, 0));
                        } else if (key === 'ArrowDown' || keyCode === 40) {
                            setEpisodeIndex(prev => Math.min(prev + 3, (selectedSerie.seasons[activeSeasonIndex]?.episodes?.length || 1) - 1));
                        } else if (key === 'ArrowUp' || keyCode === 38) {
                            if (episodeIndex < 3) {
                                setSelectedSerie(null);
                            } else {
                                setEpisodeIndex(prev => Math.max(prev - 3, 0));
                            }
                        } else if (key === 'Escape' || key === 'Backspace' || keyCode === 8 || keyCode === 27) {
                            setSelectedSerie(null);
                        } else if (key === 'Enter' || keyCode === 13) {
                            e.preventDefault();
                            const ep = selectedSerie.seasons[activeSeasonIndex]?.episodes?.[episodeIndex];
                            if (ep) {
                                setPlayingItem({ titulo: `${selectedSerie.titulo} - ${ep.titulo}`, urlDrive: ep.urlDrive });
                            }
                        }
                        return;
                    }

                    const cols = activeCategory === 'tv' ? 1 : 4; 

                    if (key === 'ArrowRight' || keyCode === 39) {
                        if (isMenuSelected) {
                            setIsMenuSelected(false);
                            setCardIndex(0);
                        } else if (activeCategory !== 'tv') {
                            setCardIndex(prev => Math.min(prev + 1, items.length - 1));
                        }
                    } else if (key === 'ArrowLeft' || keyCode === 37) {
                        if (!isMenuSelected) {
                            if (activeCategory === 'tv' || cardIndex % cols === 0) {
                                setIsMenuSelected(true);
                            } else {
                                setCardIndex(prev => Math.max(prev - 1, 0));
                            }
                        }
                    } else if (key === 'ArrowDown' || keyCode === 40) {
                        if (isMenuSelected) {
                            setMenuIndex(prev => Math.min(prev + 1, 3));
                            const cats = ['peliculas', 'series', 'animados', 'tv'];
                            changeCategory(cats[Math.min(menuIndex + 1, 3)]);
                        } else {
                            setCardIndex(prev => Math.min(prev + cols, items.length - 1));
                        }
                    } else if (key === 'ArrowUp' || keyCode === 38) {
                        if (isMenuSelected) {
                            setMenuIndex(prev => Math.max(prev - 1, 0));
                            const cats = ['peliculas', 'series', 'animados', 'tv'];
                            changeCategory(cats[Math.max(menuIndex - 1, 0)]);
                        } else {
                            if (cardIndex < cols) {
                                setIsMenuSelected(true);
                            } else {
                                setCardIndex(prev => Math.max(prev - cols, 0));
                            }
                        }
                    } else if (key === 'Enter' || keyCode === 13) {
                        e.preventDefault();
                        if (isMenuSelected) {
                            const cats = ['peliculas', 'series', 'animados', 'tv'];
                            changeCategory(cats[menuIndex]);
                            setIsMenuSelected(false);
                            setCardIndex(0);
                        } else {
                            const selected = items[cardIndex];
                            if (selected) {
                                if (selected.codigo) {
                                    setPinModalItem(selected);
                                    setPinInput('');
                                    setPinError(false);
                                } else if (selected.type === 'serie') {
                                    setSelectedSerie(selected);
                                    setActiveSeasonIndex(0);
                                    setEpisodeIndex(0);
                                } else {
                                    let playUrl = selected.urlDrive;
                                    if (activeCategory === 'tv' && playUrl.includes('drive.google.com')) {
                                        playUrl = cleanDriveUrl(playUrl);
                                    }
                                    setPlayingItem({ titulo: selected.titulo, urlDrive: playUrl });
                                }
                            }
                        }
                    }
                };

                window.addEventListener('keydown', handleKeyDown);
                return () => window.removeEventListener('keydown', handleKeyDown);
            }, [isMenuSelected, menuIndex, cardIndex, items, playingItem, pinModalItem, selectedSerie, activeSeasonIndex, episodeIndex, activeCategory]);

            const handlePinSubmit = (e) => {
                e.preventDefault();
                if (pinInput === String(pinModalItem.codigo)) {
                    const itemToPlay = pinModalItem;
                    setPinModalItem(null);
                    setPinInput('');
                    setPinError(false);
                    if (itemToPlay.type === 'serie') {
                        setSelectedSerie(itemToPlay);
                        setActiveSeasonIndex(0);
                        setEpisodeIndex(0);
                    } else {
                        setPlayingItem(itemToPlay);
                    }
                } else {
                    setPinError(true);
                    setPinInput('');
                }
            };

            const menuOptions = [
                { id: 'peliculas', label: '🎬 Películas' },
                { id: 'series', label: '🍿 Series' },
                { id: 'animados', label: '👶 Animados' },
                { id: 'tv', label: '📡 TV en Vivo' }
            ];

            return (
                <div className="w-screen h-screen flex bg-[#05070a] select-none overflow-hidden">
                    {playingItem ? (
                        <div className="fixed inset-0 z-[100] bg-black w-screen h-screen overflow-hidden flex items-center justify-center">
                            <iframe 
                                src={playingItem.urlDrive} 
                                className="w-full h-full border-0 absolute inset-0 z-10" 
                                allow="autoplay; encrypted-media; fullscreen" 
                                allowFullScreen
                            ></iframe>
                            <div className="absolute top-6 left-6 bg-black/90 px-6 py-3 rounded-2xl border border-white/20 text-sm flex items-center gap-4 shadow-2xl z-20 pointer-events-none">
                                <span className="text-red-500 font-bold">▶ Reproduciendo:</span> <b className="text-white">{playingItem.titulo}</b>
                                <span className="text-gray-400 text-xs ml-4">Presiona <b>Escape o Backspace</b> para salir</span>
                            </div>
                            {/* Botón flotante de respaldo para PC si el iframe consume el foco */}
                            <button 
                                onClick={() => setPlayingItem(null)}
                                className="absolute top-6 right-6 z-30 bg-red-600 hover:bg-red-700 text-white font-bold px-5 py-2.5 rounded-xl shadow-2xl border border-white/20 text-xs cursor-pointer"
                            >
                                ✕ Salir de Pantalla Completa
                            </button>
                        </div>
                    ) : pinModalItem ? (
                        <div className="fixed inset-0 z-[60] bg-black/90 backdrop-blur-md flex items-center justify-center p-4">
                            <div className="bg-[#161d2f] p-8 rounded-2xl max-w-sm w-full text-center border border-white/10 shadow-2xl">
                                <h3 className="text-xl font-bold text-white mb-2">Contenido Protegido por PIN</h3>
                                <p className="text-xs text-gray-400 mb-6">Ingresa el código PIN para ver "{pinModalItem.titulo}"</p>
                                <form onSubmit={handlePinSubmit}>
                                    <input 
                                        type="password" 
                                        maxLength="4" 
                                        className="w-full bg-black/60 border border-white/20 rounded-xl px-4 py-3 text-center text-3xl tracking-[0.5em] text-white focus:border-[#E50914] outline-none mb-4" 
                                        value={pinInput} 
                                        onChange={(e) => setPinInput(e.target.value)} 
                                        placeholder="••••" 
                                        autoFocus 
                                    />
                                    {pinError && <p className="text-red-500 text-xs mb-4 font-bold">Código PIN incorrecto</p>}
                                    <div className="flex gap-3">
                                        <button type="button" onClick={() => setPinModalItem(null)} className="flex-1 py-3 rounded-xl border border-white/10 text-gray-300 hover:bg-white/5 font-bold text-sm">Cancelar</button>
                                        <button type="submit" className="flex-1 py-3 rounded-xl bg-[#E50914] text-white font-bold hover:bg-red-700 text-sm">Aceptar</button>
                                    </div>
                                </form>
                            </div>
                        </div>
                    ) : selectedSerie ? (
                        <div className="flex-1 flex flex-col p-8 overflow-hidden bg-[#05070a]">
                            <div className="flex items-center gap-6 mb-6 pb-4 border-b border-white/10">
                                <img src={selectedSerie.imagen} className="w-24 h-36 object-cover rounded-xl shadow-lg border border-white/10" />
                                <div>
                                    <h2 className="text-3xl font-black text-white">{selectedSerie.titulo}</h2>
                                    <p className="text-gray-400 text-xs mt-1 max-w-2xl">{selectedSerie.descripcion || "Selecciona un episodio."}</p>
                                    <div className="flex gap-2 mt-4">
                                        {(selectedSerie.seasons || []).map((season, sIdx) => (
                                            <button 
                                                key={sIdx}
                                                onClick={() => { setActiveSeasonIndex(sIdx); setEpisodeIndex(0); }}
                                                className={`px-4 py-2 rounded-lg font-bold text-xs ${activeSeasonIndex === sIdx ? 'bg-[#E50914] text-white' : 'bg-[#161d2f] text-gray-400 border border-white/10'}`}
                                            >
                                                Temporada {season.season_number}
                                            </button>
                                        ))}
                                    </div>
                                </div>
                            </div>
                            <div className="flex-1 overflow-y-auto no-scrollbar pb-6 pr-2">
                                <div className="grid grid-cols-3 gap-4">
                                    {selectedSerie.seasons[activeSeasonIndex]?.episodes?.map((ep, eIdx) => (
                                        <div
                                            key={eIdx}
                                            ref={el => episodeRefs.current[eIdx] = el}
                                            tabIndex="0"
                                            onClick={() => setPlayingItem({ titulo: `${selectedSerie.titulo} - ${ep.titulo}`, urlDrive: ep.urlDrive })}
                                            onMouseEnter={() => setEpisodeIndex(eIdx)}
                                            className={`tv-focusable p-4 rounded-xl bg-[#161d2f] cursor-pointer border-2 border-transparent flex items-center justify-between ${episodeIndex === eIdx ? 'focused' : ''}`}
                                        >
                                            <div>
                                                <span className="text-[10px] text-red-500 font-bold uppercase tracking-wider">Episodio {eIdx + 1}</span>
                                                <h4 className="text-sm font-bold text-white mt-0.5">{ep.titulo}</h4>
                                            </div>
                                            <div className="p-2 bg-black/40 rounded-full text-white"><span className="text-xs">▶</span></div>
                                        </div>
                                    ))}
                                </div>
                            </div>
                            <div className="pt-3 border-t border-white/10 text-xs text-gray-500">
                                <span>Presiona <b>Escape / Flecha Arriba</b> para volver</span>
                            </div>
                        </div>
                    ) : (
                        <>
                            {/* Menú Lateral Fijo */}
                            <div className="w-80 bg-[#0c101d] border-r border-white/10 p-6 flex flex-col justify-between shrink-0 shadow-2xl">
                                <div>
                                    <div className="mb-8 pt-2">
                                        <h1 className="text-3xl font-black tracking-tight text-white"><span className="text-[#E50914]">MAGIS</span> TV</h1>
                                        <p className="text-gray-400 text-xs mt-1">Smart TV Ultimate Edition</p>
                                    </div>
                                    <nav className="flex flex-col gap-3">
                                        {menuOptions.map((opt, idx) => (
                                            <button
                                                key={opt.id}
                                                ref={el => menuRefs.current[idx] = el}
                                                tabIndex="0"
                                                onClick={() => {
                                                    setMenuIndex(idx);
                                                    setIsMenuSelected(true);
                                                    changeCategory(opt.id);
                                                }}
                                                onMouseEnter={() => {
                                                    setMenuIndex(idx);
                                                    setIsMenuSelected(true);
                                                    changeCategory(opt.id);
                                                }}
                                                className={`tv-focusable w-full text-left px-5 py-4 rounded-2xl font-bold text-sm transition-all flex items-center justify-between bg-[#161d2f] text-gray-200 border-2 border-transparent ${isMenuSelected && menuIndex === idx ? 'focused' : ''}`}
                                            >
                                                <span className="text-base">{opt.label}</span>
                                                {activeCategory === opt.id && <div className="w-2.5 h-2.5 rounded-full bg-[#E50914] shadow-[0_0_10px_#E50914]"></div>}
                                            </button>
                                        ))}
                                    </nav>
                                </div>
                                <div className="text-xs text-gray-500 border-t border-white/10 pt-4">
                                    <p className="font-bold text-gray-400">Instrucciones PC / TV:</p>
                                    <p className="mt-1">Usa las <b>Flechas</b> y <b>Enter</b>.</p>
                                </div>
                            </div>

                            {/* Área Principal de Contenido */}
                            <div className="flex-1 flex flex-col p-8 overflow-hidden bg-[#05070a]">
                                <div className="flex justify-between items-center mb-6 border-b border-white/10 pb-4">
                                    <div>
                                        <h2 className="text-3xl font-extrabold capitalize text-white tracking-tight">{activeCategory}</h2>
                                        <p className="text-gray-400 text-xs mt-0.5">Mostrando {items.length} títulos disponibles</p>
                                    </div>
                                    <div className="bg-[#161d2f] px-4 py-2 rounded-xl border border-white/10 text-xs text-gray-300">
                                        Estado: <b className="text-red-500">{isMenuSelected ? 'En Menú Lateral' : 'Navegando Contenido'}</b>
                                    </div>
                                </div>

                                <div className="flex-1 overflow-y-auto no-scrollbar pb-6 pr-2">
                                    {activeCategory === 'tv' ? (
                                        <div className="flex flex-col gap-2">
                                            <div className="grid grid-cols-12 bg-[#161d2f] px-4 py-2.5 rounded-xl font-bold text-xs text-gray-400 uppercase border border-white/5">
                                                <div className="col-span-1 text-center">#</div>
                                                <div className="col-span-8">Nombre del Canal</div>
                                                <div className="col-span-3 text-right">Categoría</div>
                                            </div>
                                            {items.map((item, index) => (
                                                <div 
                                                    key={index}
                                                    ref={el => cardRefs.current[index] = el}
                                                    tabIndex="0"
                                                    onClick={() => {
                                                        setCardIndex(index);
                                                        setIsMenuSelected(false);
                                                        setPlayingItem({ titulo: item.titulo, urlDrive: item.urlDrive });
                                                    }}
                                                    onMouseEnter={() => {
                                                        setCardIndex(index);
                                                        setIsMenuSelected(false);
                                                    }}
                                                    className={`tv-focusable grid grid-cols-12 items-center px-4 py-3 rounded-xl bg-[#0f1420] border border-white/5 cursor-pointer text-sm font-medium ${!isMenuSelected && cardIndex === index ? 'focused' : ''}`}
                                                >
                                                    <div className="col-span-1 text-gray-500 font-bold text-xs text-center">{index + 1}</div>
                                                    <div className="col-span-8 text-white flex items-center gap-3 truncate">
                                                        {item.imagen && <img src={item.imagen} className="w-6 h-6 object-contain rounded bg-white/10 p-0.5" onError={(e)=>e.target.style.display='none'} />}
                                                        <span className="truncate">{item.titulo}</span>
                                                    </div>
                                                    <div className="col-span-3 text-right text-xs text-gray-400 truncate">{item.group || 'TV en Vivo'}</div>
                                                </div>
                                            ))}
                                        </div>
                                    ) : (
                                        <div className="grid grid-cols-4 gap-6">
                                            {items.map((item, index) => (
                                                <div 
                                                    key={index}
                                                    ref={el => cardRefs.current[index] = el}
                                                    tabIndex="0"
                                                    onClick={() => {
                                                        setCardIndex(index);
                                                        setIsMenuSelected(false);
                                                        if (item.codigo) {
                                                            setPinModalItem(item);
                                                            setPinInput('');
                                                            setPinError(false);
                                                        } else if (item.type === 'serie') {
                                                            setSelectedSerie(item);
                                                            setActiveSeasonIndex(0);
                                                            setEpisodeIndex(0);
                                                        } else {
                                                            setPlayingItem(item);
                                                        }
                                                    }}
                                                    onMouseEnter={() => {
                                                        setCardIndex(index);
                                                        setIsMenuSelected(false);
                                                    }}
                                                    className={`tv-focusable group relative flex flex-col gap-2.5 cursor-pointer rounded-2xl bg-[#161d2f] p-3.5 border-2 border-transparent ${!isMenuSelected && cardIndex === index ? 'focused' : ''}`}
                                                >
                                                    <div className="relative aspect-[2/3] overflow-hidden rounded-xl bg-black/60 shadow-xl">
                                                        <img 
                                                            src={item.imagen} 
                                                            alt={item.titulo} 
                                                            className="w-full h-full object-cover group-hover:scale-105 transition-transform duration-300" 
                                                            onError={(e) => e.target.src = 'https://placehold.co/300x450/1f2937/ffffff?text=MAGIS+TV'} 
                                                        />
                                                        <div className="absolute inset-0 bg-gradient-to-t from-black/90 via-transparent to-transparent opacity-60"></div>
                                                        {item.codigo && (
                                                            <span className="absolute top-2.5 right-2.5 bg-yellow-500 text-black text-[10px] font-extrabold px-2 py-0.5 rounded shadow">PIN</span>
                                                        )}
                                                    </div>
                                                    <h3 className="text-xs font-bold text-white truncate text-center mt-1">{item.titulo}</h3>
                                                </div>
                                            ))}
                                        </div>
                                    )}
                                </div>
                            </div>
                        </>
                    )}
                </div>
            );
        };

        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<App />);
    </script>
</body>
</html>
